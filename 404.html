<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages 404 Hack
      var l = window.location;
      var redirectUrl = l.protocol + '//' + l.host + '/?p=' + l.pathname;
      l.replace(redirectUrl);
    </script>
  </head>

  </body>
</html>
