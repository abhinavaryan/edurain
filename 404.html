<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>EduRain</title>
    <script>
      // GitHub Pages SPA redirect — only for truly unknown paths
      // Known routes (courses/iit-jee, blogs/slug etc.) now have their own
      // index.html so they will NEVER hit this 404 page.
      var l = window.location;
      var redirectUrl = l.protocol + '//' + l.host + '/?p=' + l.pathname + l.search;
      l.replace(redirectUrl);
    </script>
  </head>
  <body>
  </body>
</html>
