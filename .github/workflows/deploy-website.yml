# Builds www.edurain.in and publishes it to the gh-pages branch, the same as `npm run deploy` on a PC.
# Started by the Blog Admin (its Deploy button and every blog save, through the backend), from the Actions tab,
# and every 6 hours as a safety net. A new blog is live about 2 minutes after a run starts.
name: Deploy website

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

# One deploy at a time. A request during a deploy waits and runs once after it, so the newest blogs always go out.
concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_CDN_URL: ${{ secrets.VITE_CDN_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx gh-pages -d dist -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
