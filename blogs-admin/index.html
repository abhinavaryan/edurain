  <script>
    (function () {
      if (localStorage.getItem('er_cookie_consent')) return;
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;bottom:16px;left:16px;right:16px;' +
        'max-width:520px;margin:0 auto;background:#0d1f14;' +
        'color:#f8fafc;border:1px solid rgba(74,222,128,0.3);' +

        'font-family:sans-serif;font-size:13.5px;line-height:1.4;';
      banner.innerHTML = `
        <span>
          We use cookies and cache to deliver course material and improve your learning experience. Read our <a href="/privacy" style="color:#4ade80;text-decoration:underline;">Privacy Policy</a>.
        </span>
        <button id="er-accept-cookies" style="background:#16a34a;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap;">
          Accept
        </button>
      `;
      document.body.appendChild(banner);
      document.getElementById('er-accept-cookies').onclick = function () {
        localStorage.setItem('er_cookie_consent', 'accepted');
        banner.remove();
      };
    })();
